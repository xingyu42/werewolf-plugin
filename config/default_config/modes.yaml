# Werewolf game mode presets
# Defines role configurations for different player counts.
# Each entry is keyed by the player count.
#
# 'name': A descriptive name for the game mode.
# 'description': A brief, human-readable summary of the role composition.
# 'roles': An object where keys are role names (uppercase) and values are the count of that role.
#
# The sum of role counts MUST equal the player count key.
# Example for an 8-player game:
#   8:
#     name: "8-Player Hunter's Game"
#     description: "2 Wolves, 1 Prophet, 1 Witch, 1 Hunter, 1 Guard, 2 Villagers"
#     roles:
#       WOLF: 2
#       PROPHET: 1
#       WITCH: 1
#       HUNTER: 1
#       GUARD: 1
#       VILLAGER: 2

presets:
